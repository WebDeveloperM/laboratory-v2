upstream employee_upstream {
    server employee-service:5000;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/certs/employee.crt;
    ssl_certificate_key /etc/nginx/certs/employee.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 250M;

    # Rasmlarni nginx o'zi uzatadi, Django orqali emas. Ilgari har bir surat
    # Python jarayonidan o'tardi va serverni bloklardi — 7544 ta fayl uchun bu
    # juda og'ir edi. Bu blok DEBUG=False bo'lganda ham ishlaydi (Django u holda
    # media'ni umuman bermaydi, config/urls.py dagi shartga qarang).
    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://employee_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
